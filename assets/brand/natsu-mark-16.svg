<!--
  Natsu - mark, full colour (transparent background) - small16 preset
  An Endless Summer hydrangea head of loose, stacked sepals (some still in irregular groups of four),
  coloured along one diagonal (glacier blue -> lavender -> mist pink) and lit radially (lighter indigo
  centre, light crown, slightly deeper rim), with a white ">" and mist-pink "_" glowing in its centre.
  Generated by assets/brand/tools/natsu_icon.py - edit the generator, not this file. Spec: assets/brand/README.md
-->
