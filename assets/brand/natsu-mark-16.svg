      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft white outer glow around the prompt. -->
    <filter id="natsu-prompt-glow" x="-40%" y="-60%" width="180%" height="220%" color-interpolation-filters="sRGB">
